{% extends "base.html" %}
{% block title %}Create Event - EventHub{% endblock %}
{% block content %}
<div class="page-wrapper" style="max-width: 700px;">
    <div class="page-header">
        <h1>Create New Event</h1>
        <p>Fill in the details to publish a new event</p>
    </div>

    <div class="detail-card">
        <form method="POST">
            <div class="form-group">
                <label>Event Title</label>
                <input type="text" name="title" placeholder="e.g. Tech Innovators Summit" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Describe what this event is about..." required></textarea>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" placeholder="e.g. Main Auditorium" required>
            </div>
            <div class="form-group">
                <label>Date & Time</label>
                <input type="datetime-local" name="event_date" required>
            </div>
            <div class="form-group">
                <label>Capacity</label>
                <input type="number" name="capacity" value="50" min="1" required>
            </div>
            <button type="submit" class="btn-primary">Publish Event</button>
        </form>
    </div>
</div>
{% endblock %}
