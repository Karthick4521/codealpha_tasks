{% extends "base.html" %}
{% block title %}Sign Up - TastePoint{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">🍴</div>
        <h1>Join the Team</h1>
        <p class="auth-subtitle">Create a staff account for TastePoint</p>

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required autofocus>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@tastepoint.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" name="is_admin" id="is_admin">
                <label for="is_admin">I am a manager/admin (menu &amp; inventory access)</label>
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
