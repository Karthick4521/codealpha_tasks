{% extends "base.html" %}
{% block title %}Login - TastePoint{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">🍴</div>
        <h1>TastePoint</h1>
        <p class="auth-subtitle">Staff login — manage orders, tables & inventory</p>

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <p class="auth-footer">New staff member? <a href="{{ url_for('register') }}">Create account</a></p>

        <div class="demo-hint">
            💡 Demo admin login — Username: <strong>admin</strong> · Password: <strong>admin123</strong>
        </div>
    </div>
</div>
{% endblock %}
